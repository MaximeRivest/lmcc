[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcc"
version = "0.8.3"   # equals the kernel version (lmcc.KERNEL_VERSION)
description = "The language model calling convention: typed signatures to messages and replies to typed values"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Maxime Rivest" }]
keywords = ["llm", "language models", "prompting", "parsing", "structured output"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/MaximeRivest/lmcc"
Source = "https://github.com/MaximeRivest/lmcc"
Specification = "https://github.com/MaximeRivest/lmcc/blob/master/contract/spec/kernel.md"

[project.optional-dependencies]
dspy = ["dspy>=3.0", "pydantic>=2"]
# lm15 at an exact release, bumped deliberately (see python/lmcc_lm15/check)
lm15 = ["lm15==1.0.1"]

[tool.setuptools]
packages = ["lmcc", "lmcc_std", "lmcc_dspy", "lmcc_lm15"]
