[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcc"
version = "0.1.0"
description = "The language model calling convention: typed signatures to messages and replies to typed values"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["lmcc", "lmcc_std"]
