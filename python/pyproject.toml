[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a15"
version = "0.1.0"
description = "The adapter kernel: typed signature <-> messages, as data"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["a15", "a15_std"]
